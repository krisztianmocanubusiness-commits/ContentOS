name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: content_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The lint/typecheck/build steps don't need a live database — only
      # `npm run test` (some Server Action tests are DB-backed integration
      # tests) exercises the postgres service above.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/content_os_test"
      AUTH_SECRET: "ci-only-dummy-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npx prisma migrate deploy

      - run: npm run test

      - run: npm run build
