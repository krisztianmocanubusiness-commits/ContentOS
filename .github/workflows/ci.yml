name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-time only — no live database is needed to lint, typecheck,
      # unit-test, or build. Real Postgres-backed integration tests are a
      # fast-follow that needs a CI Postgres service container.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/dummy"
      AUTH_SECRET: "ci-only-dummy-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test

      - run: npm run build
